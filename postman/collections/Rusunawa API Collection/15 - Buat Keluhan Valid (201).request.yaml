$kind: http-request
description: Memastikan penghuni dapat melihat daftar booking miliknya.
url: "{{base_url}}/api/complaints"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: '{"title":"Tes keluhan Postman","category":"fasilitas","description":"Keluhan uji dari Postman."}'
auth:
  type: bearer
  credentials:
    token: "{{resident_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test("format {status,message,data}", () => {
        pm.expect(j.status).to.eql("success");
        pm.expect(j).to.have.property("message");
        pm.expect(j).to.have.property("data");
      });
    language: text/javascript
order: 12870
