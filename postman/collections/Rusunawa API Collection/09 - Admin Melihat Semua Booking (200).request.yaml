$kind: http-request
description: Menggunakan token admin yang diperoleh pada request nomor 01.
url: "{{base_url}}/api/admin/bookings"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP status 200 for admin", function () {
      pm.response.to.have.status(200); });
    language: text/javascript
order: 14000
