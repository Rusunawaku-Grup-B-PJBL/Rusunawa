$kind: http-request
description: Controller memang mengembalikan HTTP 422 untuk kredensial yang salah.
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@ubbg.ac.id",
      "password": "password-salah"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status 422 for invalid credentials", function () { pm.response.to.have.status(422); });
      const data = pm.response.json();
      pm.test("Error message is present", function () {
          pm.expect(data.message).to.eql("Email atau kata sandi salah.");
      });
    language: text/javascript
order: 5000
