$kind: http-request
description: Menggunakan room_id yang disimpan otomatis dari request daftar
  kamar. Jalankan setelah request nomor 06.
url: "{{base_url}}/api/rooms/{{room_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{resident_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status 200", function () { pm.response.to.have.status(200); });
      pm.test("Room detail response is JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
    language: text/javascript
order: 10000
